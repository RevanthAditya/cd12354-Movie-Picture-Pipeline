name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: frontend

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Set image tag
        working-directory: starter/frontend/k8s
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          kustomize edit set image \
            frontend="$ECR_REGISTRY:$GITHUB_SHA"

      - name: Deploy frontend
        working-directory: starter/frontend/k8s
        run: |
          kustomize build | kubectl apply -f -
      - name: Debug before rollout
        run: |
          echo "===== Deployments ====="
          kubectl get deployment frontend -o wide

          echo "===== ReplicaSets ====="
          kubectl get rs

          echo "===== Pods ====="
          kubectl get pods -o wide

          echo "===== Describe Deployment ====="
          kubectl describe deployment frontend

          echo "===== Describe ReplicaSets ====="
          kubectl describe rs

          echo "===== Events ====="
          kubectl get events --sort-by=.metadata.creationTimestamp

          echo "===== Frontend Pods ====="
          kubectl describe pods -l app=frontend || true

          for pod in $(kubectl get pods -l app=frontend -o jsonpath='{.items[*].metadata.name}'); do
            echo "===== LOGS: $pod ====="
            kubectl logs "$pod" --all-containers=true || true
          done


      - name: Verify rollout
        id: rollout
        continue-on-error: true
        run: |
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Debug cluster
        if: always()
        run: |
          echo "===== Nodes ====="
          kubectl get nodes -o wide || true

          echo "===== Deployments ====="
          kubectl get deployments || true

          echo "===== ReplicaSets ====="
          kubectl get rs || true

          echo "===== Pods ====="
          kubectl get pods -o wide || true

          echo "===== Frontend Deployment ====="
          kubectl describe deployment frontend || true

          echo "===== Frontend Pods ====="
          kubectl describe pods -l app=frontend || true

          echo "===== Events ====="
          kubectl get events --sort-by=.metadata.creationTimestamp || true

          echo "===== Frontend Logs ====="
          kubectl logs deployment/frontend --all-containers=true || true

      - name: Fail workflow if rollout failed
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "Frontend deployment rollout failed."
          exit 1